[package]
name = "unkcore"
version = "0.3.0"
description = "Unknow Web Browser's back end for its Gecko build"
edition = "2021"

[lib]
name = "unkcore"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
dirs = "6"
ureq = "2"
regex = "1"
addr = "0.15"
sha2 = "0.10"
flate2 = "1"
url = "2"
adblock = { version = "0.10", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
