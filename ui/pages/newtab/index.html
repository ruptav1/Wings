<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Tab mới</title>
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="newtab.css" />
    <script type="module" src="newtab.js"></script>
  </head>
  <body>
    <div id="wall"><video id="wall-video" muted loop playsinline hidden></video><div id="wall-dim"></div></div>
    <main id="center">
      <section id="hero">
        <div id="clock"></div>
        <div id="greeting"></div>
      </section>
      <form id="search" autocomplete="off">
        <span id="engine-ico"></span>
        <input id="q" type="text" spellcheck="false" placeholder="Tìm kiếm hoặc nhập địa chỉ" />
      </form>
      <section id="dial"></section>
    </main>
    <button id="customize" class="icon-btn" title="Tùy chỉnh trang Tab mới" data-icon="sliders" data-size="18"></button>
  </body>
</html>
